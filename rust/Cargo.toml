[package]
name = "devdesk-scan"
version = "0.1.0"
edition = "2021"
description = "Fast file scanning and search for DevDesk"
authors = ["DevDesk Team"]
license = "MIT"

[[bin]]
name = "devdesk-scan"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
ignore = "0.4"
blake3 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
