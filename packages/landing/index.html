<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevDesk — local-first developer workspace</title>
    <meta
      name="description"
      content="DevDesk is a local-first desktop app that combines a project manager, command vault, Docker controls, terminals, and local code search into one workspace."
    />

    <!-- Generated by: npm run landing:assets -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/logo-mark-tile.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b1128" />

    <!-- Phase 4 replaces these relative URLs with absolute ones once the domain exists. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DevDesk — local-first developer workspace" />
    <meta
      property="og:description"
      content="Projects, command vault, Docker controls, terminals, and local code search in one local-first workspace. No account, no telemetry."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <script>
      // Dark by default; honour a stored choice before first paint to avoid a flash.
      try {
        var stored = localStorage.getItem('devdesk-site-theme')
        if (stored === 'light') document.documentElement.classList.remove('dark')
      } catch (error) {
        /* localStorage unavailable: keep the default dark class */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
