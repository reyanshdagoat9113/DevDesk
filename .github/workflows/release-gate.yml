name: Release gate

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    defaults:
      run:
        working-directory: DevDesk

    steps:
      - name: Checkout monorepo layout (DevDesk + engine)
        uses: actions/checkout@v4
        with:
          path: DevDesk

      - name: Checkout devdesk-addons (engine sibling)
        uses: actions/checkout@v4
        with:
          repository: reyanshdagoat9113/devdesk-addons
          path: devdesk-addons
          # Prefer same-named branch when present; fall back to default branch.
          ref: ${{ github.base_ref || github.ref_name }}
        continue-on-error: true

      - name: Ensure engine checkout (default branch fallback)
        if: hashFiles('devdesk-addons/devdesk-engine/package.json') == ''
        uses: actions/checkout@v4
        with:
          repository: reyanshdagoat9113/devdesk-addons
          path: devdesk-addons

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: DevDesk/package-lock.json

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2

      - name: Install Rust (engine binary)
        uses: dtolnay/rust-toolchain@stable

      - name: Install app dependencies
        run: npm ci

      - name: Install engine dependencies
        working-directory: devdesk-addons/devdesk-engine
        run: npm ci

      - name: Ensure Node natives
        run: npm run rebuild:native:node

      - name: Release gate (typecheck, lint, tests, engine smoke)
        run: npm run release:gate

      - name: Packaged app smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run verify:win-package

      - name: Packaged app smoke (Linux)
        if: runner.os == 'Linux'
        run: npm run verify:linux-package
