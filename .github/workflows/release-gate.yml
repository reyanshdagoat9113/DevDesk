name: Release gate

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-coverage:
    name: Static and coverage (ubuntu / Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DevDesk
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Compatibility lane tracks Node 22 line; local default pin is .nvmrc (22.23.1).
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: npm ci

      - name: Ensure Node natives
        run: npm run rebuild:native:node

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architecture lint
        run: npm run lint:architecture

      - name: Coverage (desktop, renderer, engine)
        run: npm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/**
            packages/engine/coverage/**
          if-no-files-found: warn

  native-integration:
    name: Native and integration (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ['22', '24']
    steps:
      - name: Checkout DevDesk
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64

      - name: Install Rust (engine binary)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build IPC contracts
        run: npm run build:ipc-contracts

      - name: Ensure Node natives
        run: npm run rebuild:native:node

      - name: Desktop tests
        run: npm run test:run

      - name: Renderer tests
        run: npm run test:renderer:run

      - name: Engine tests
        run: npm run test:engine

      - name: Engine IPC integration
        run: npm run test:engine-ipc

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout DevDesk
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test (locked)
        working-directory: packages/engine/rust
        run: cargo test --locked

      - name: Cargo build release (packaged engine parity)
        working-directory: packages/engine/rust
        run: cargo build --release --locked

  package-verification:
    name: Package verification (${{ matrix.os }} / Node 22)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout DevDesk
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 xvfb xauth

      - name: Install Rust (engine binary)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build IPC contracts
        run: npm run build:ipc-contracts

      - name: Packaged engine smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run smoke:engine-packaged

      - name: Packaged engine smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke:engine-packaged

      - name: Packaged app smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run verify:win-package

      - name: Packaged app smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run verify:linux-package
