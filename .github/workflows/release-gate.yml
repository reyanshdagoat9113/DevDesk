name: Release gate

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  # A fast-forward promotion can push the same commit to dev and main at once.
  # Keying by commit cancels the duplicate run without conflating different SHAs.
  group: release-gate-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-coverage:
    name: Static and coverage (ubuntu / Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DevDesk
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Compatibility lane tracks Node 22 line; local default pin is .nvmrc (22.23.1).
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: npm ci

      - name: Ensure Node natives
        run: npm run rebuild:native:node

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architecture lint
        run: npm run lint:architecture

      - name: Coverage (desktop, renderer, engine)
        run: npm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage/**
            packages/engine/coverage/**
          if-no-files-found: warn

  native-integration:
    name: Native and integration (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ['22', '24']
    steps:
      - name: Checkout DevDesk
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64

      - name: Install Rust (engine binary)
        if: matrix.node == '22'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build output
        if: matrix.node == '22'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/engine/rust/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('packages/engine/rust/Cargo.lock') }}-${{ hashFiles('packages/engine/rust/Cargo.toml', 'packages/engine/rust/src/**') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ hashFiles('packages/engine/rust/Cargo.lock') }}-
            cargo-release-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build IPC contracts
        run: npm run build:ipc-contracts

      - name: Ensure Node natives
        run: npm run rebuild:native:node

      - name: Desktop tests
        run: npm run test:run

      - name: Engine tests
        run: npm run test:engine

      - name: Engine IPC integration
        if: matrix.node == '22'
        run: npm run test:engine-ipc

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout DevDesk
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/engine/rust/target
          key: cargo-debug-${{ runner.os }}-${{ hashFiles('packages/engine/rust/Cargo.lock') }}-${{ hashFiles('packages/engine/rust/Cargo.toml', 'packages/engine/rust/src/**') }}
          restore-keys: |
            cargo-debug-${{ runner.os }}-${{ hashFiles('packages/engine/rust/Cargo.lock') }}-
            cargo-debug-${{ runner.os }}-

      - name: Cargo test (locked)
        working-directory: packages/engine/rust
        run: cargo test --locked

  package-verification:
    name: Package verification (${{ matrix.os }} / Node 22)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package_command: npm run package:win:dir
            verify_command: npm run verify:win-package:prepared
            smoke_command: npm run smoke:engine-packaged:prepared
          - os: ubuntu-latest
            package_command: npm run package:linux:dir
            verify_command: xvfb-run --auto-servernum npm run verify:linux-package:prepared
            smoke_command: xvfb-run --auto-servernum npm run smoke:engine-packaged:prepared
    steps:
      - name: Checkout DevDesk
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache electron-builder tooling
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron-builder
            ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 xvfb xauth

      - name: Install Rust (engine binary)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/engine/rust/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('packages/engine/rust/Cargo.lock') }}-${{ hashFiles('packages/engine/rust/Cargo.toml', 'packages/engine/rust/src/**') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ hashFiles('packages/engine/rust/Cargo.lock') }}-
            cargo-release-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build unpacked package
        run: ${{ matrix.package_command }}

      - name: Verify unpacked package
        run: ${{ matrix.verify_command }}

      - name: Verify packaged engine harness
        run: ${{ matrix.smoke_command }}
