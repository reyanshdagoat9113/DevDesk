name: Publish Linux deb

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit containing the Debian-only packaging configuration
        required: true
        default: dev
        type: string
      release_tag:
        description: Existing GitHub Release tag that receives the deb
        required: true
        default: v0.1.1
        type: string

permissions:
  contents: write

jobs:
  package-and-publish:
    name: Package, verify, and upload deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 fakeroot dpkg libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64

      - name: Install dependencies
        run: npm ci

      - name: Build Debian package
        run: npm run package:linux

      - name: Verify unpacked Linux package
        run: npm run verify:linux-package

      - name: Generate checksum
        run: sha256sum release/*.deb > release/SHA256SUMS-linux.txt

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-${{ inputs.release_tag }}
          path: |
            release/*.deb
            release/SHA256SUMS-linux.txt
          if-no-files-found: error

      - name: Attach Debian package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" release/*.deb release/SHA256SUMS-linux.txt --clobber
